<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sthala — Franchise Expansion Desk</title>
  <meta name="description" content="Upload franchise applications and territories; get explainable partner decisions, pin-code allocation, a catchment map and personalised onboarding plans.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='13' r='9' fill='%237a1f2b'/><path d='M16 30 L9 18 L23 18Z' fill='%237a1f2b'/><circle cx='16' cy='13' r='3.5' fill='%23c8932f'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@600;700&family=Noto+Sans+Devanagari:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="kn">ಸ್ಥಳ</span><span class="en">Sthala</span><span class="tag">Franchise expansion desk</span></div>
    <span class="spacer"></span>
    <span id="fileName" class="file-name" hidden></span>
    <button class="btn sm ghost" id="btnTemplate" title="Download the blank judge template">Template</button>
    <button class="btn sm" id="btnExport" hidden>Export ⤓</button>
    <button class="btn sm primary" id="btnUpload">Upload workbook</button>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden>
  </header>
  <div class="shell">
    <main class="main" id="main"></main>
    <aside class="copilot" id="copilot">
      <div class="cp-head"><div class="dot"></div><div><b>Expansion copilot</b><small id="cpMode">Answers from this workbook only</small></div>
        <span class="spacer" style="flex:1"></span><button class="btn sm ghost cp-close" id="cpClose" hidden>✕</button></div>
      <div class="cp-log" id="cpLog"></div>
      <form class="cp-in" id="cpForm"><textarea id="cpText" placeholder="Ask why, or tell me something new… e.g. APP-012 has now found a ground-floor space" rows="2"></textarea><button type="submit">Send</button></form>
    </aside>
  </div>
  <button class="btn primary cp-toggle" id="cpToggle">💬 Copilot</button>
  <div class="drawer-bg" id="drawerBg"></div>
  <aside class="drawer" id="drawer"></aside>
  <div class="toast" id="toast"></div>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
