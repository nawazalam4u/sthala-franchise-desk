<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sthala — Franchise Expansion Desk</title>
  <meta name="description" content="Upload franchise applications and territories; get explainable partner decisions, pin-code allocation, a catchment map and personalised onboarding plans.">
  <meta name="theme-color" content="#0d2b20">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='11' fill='%230d2b20'/><path d='M20 7c-5.5 0-9.5 4.2-9.5 9.4 0 6.6 9.5 16.6 9.5 16.6s9.5-10 9.5-16.6C29.5 11.2 25.5 7 20 7z' fill='%23e6a93a'/><rect x='15.5' y='13' width='9' height='7' rx='1.5' fill='%230d2b20'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Kannada:wght@500;700&family=Noto+Sans+Devanagari:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="./" aria-label="Sthala home">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#1a4a37"/><path d="M20 7c-5.5 0-9.5 4.2-9.5 9.4 0 6.6 9.5 16.6 9.5 16.6s9.5-10 9.5-16.6C29.5 11.2 25.5 7 20 7z" fill="#e6a93a"/><path d="M15 15.5h10l-1-3h-8z" fill="#0d2b20"/><rect x="15.8" y="15.5" width="8.4" height="5.5" rx="1" fill="#0d2b20"/><rect x="18.6" y="17.6" width="2.8" height="3.4" fill="#e6a93a"/></svg>
      <span class="en">Sthala</span><span class="kn">ಸ್ಥಳ</span><span class="tag">Franchise expansion desk</span>
    </a>
    <span class="spacer"></span>
    <span id="fileName" class="file-name" hidden></span>
    <button class="btn sm ghost-d" id="btnTemplate" title="Download the blank judge template">⤓ Template</button>
    <button class="btn sm ghost-d" id="btnExport" hidden>Export report</button>
    <button class="btn sm primary" id="btnUpload">Upload workbook</button>
    <input type="file" id="fileInput" accept=".xlsx,.xls" hidden>
  </header>
  <div class="shell">
    <main class="main" id="main"></main>
    <aside class="copilot" id="copilot">
      <div class="cp-head"><div class="orb"></div><div><b>Expansion copilot</b><small>Ask why · or tell me what changed</small></div>
        <span style="flex:1"></span><span class="ai-chip" id="aiChip" title="Gemini answers open questions; rules stay in code">AI: checking</span><button class="btn sm ghost-d" id="cpClose" hidden>✕</button></div>
      <div class="cp-log" id="cpLog"></div>
      <form class="cp-in" id="cpForm"><button type="button" class="mic" id="micBtn" title="Speak (English, Hindi or Kannada)">🎙</button><textarea id="cpText" placeholder="e.g. APP-012 has now found a ground-floor space" rows="2"></textarea><button type="submit" class="send">Send</button></form>
    </aside>
  </div>
  <button class="btn primary cp-toggle" id="cpToggle">✦ Copilot</button>
  <div class="drawer-bg" id="drawerBg"></div>
  <aside class="drawer" id="drawer" aria-live="polite"></aside>
  <div class="toast" id="toast"></div>
  <canvas id="confetti"></canvas>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/leaflet.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
